<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#F59E0B" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background soft circle -->
  <circle cx="50" cy="50" r="46" fill="#38BDF8" />
  <circle cx="50" cy="50" r="41" fill="#E0F2FE" />
  <!-- Cheerful Star Mascot -->
  <path d="M 50 14 
           L 58 35 
           L 81 36 
           L 63 50 
           L 69 73 
           L 50 60 
           L 31 73 
           L 37 50 
           L 19 36 
           L 42 35 Z" 
        fill="url(#starGrad)" stroke="#D97706" stroke-width="2.5" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- Cute Eyes -->
  <ellipse cx="44" cy="44" rx="3.5" ry="4.5" fill="#1E293B"/>
  <ellipse cx="56" cy="44" rx="3.5" ry="4.5" fill="#1E293B"/>
  <circle cx="45.5" cy="42.5" r="1.5" fill="#FFFFFF"/>
  <circle cx="57.5" cy="42.5" r="1.5" fill="#FFFFFF"/>
  <!-- Rosy Cheeks -->
  <circle cx="39" cy="49" r="2.5" fill="#FB7185" opacity="0.6"/>
  <circle cx="61" cy="49" r="2.5" fill="#FB7185" opacity="0.6"/>
  <!-- Big Happy Smile -->
  <path d="M 45 50 Q 50 56 55 50" fill="none" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round"/>
</svg>