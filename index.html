<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#38BDF8" />
    <meta name="description" content="Bodhi Learn - playful reading, math, logic and science games up to grade 3, and Texas STAAR® test practice from grade 4." />
    <link rel="manifest" href="/manifest.json" />
    <title>Bodhi Learn 🌟 Reading, Math, Logic & Science for Kids</title>
    <!-- Kid-Friendly Premium Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Lexend digits only (text=...): Test Prep pairs them with Atkinson Hyperlegible, whose zero is slashed -->
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;700&text=0123456789&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        var url = "https://simkeyurapp.web.app/collect";
        fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            siteId: "bodhi-learn",
            path: location.pathname,
            referrer: document.referrer,
          }),
          keepalive: true,
        }).catch(function () {});
      })();
    </script>
  </body>
</html>
